<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Jogo - Game Catalog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-custom {
            background-color: #202024;
            border: 1px solid #323238;
            border-radius: 8px;
        }
        .btn-purple {
            background-color: #8257e5;
            color: white;
            font-weight: 600;
        }
        .btn-purple:hover {
            background-color: #996dff;
            color: white;
        }
        /* Estas duas linhas resolvem o texto apagado */
        .text-purple { color: #8257e5; }
        .form-label { color: #e1e1e6; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-custom p-4">
                <h3 class="mb-4 text-purple">
                    <i class="bi bi-controller me-2"></i>
                    <span th:text="${jogo.id == null ? 'Novo Jogo' : 'Editar Jogo'}">Formulário</span>
                </h3>

                <form th:action="@{/jogos/salvar}" method="post" th:object="${jogo}">
                    <!-- Campo Oculto para ID (Edição) -->
                    <input type="hidden" th:field="*{id}">

                    <!-- Título -->
                    <div class="mb-3">
                        <label class="form-label">Título *</label>
                        <input type="text" th:field="*{titulo}" class="form-control bg-dark text-light border-secondary" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{titulo}">Erro no título</div>
                    </div>

                    <div class="row">
                        <!-- Gênero -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Gênero *</label>
                            <input type="text" th:field="*{genero}" class="form-control bg-dark text-light border-secondary" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{genero}">Erro no gênero</div>
                        </div>

                        <!-- Preço -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Preço (R$) *</label>
                            <input type="number" step="0.01" th:field="*{preco}" class="form-control bg-dark text-light border-secondary" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{preco}">Erro no preço</div>
                        </div>
                    </div>

                    <div class="row">
                        <!-- Data de Lançamento -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Data de Lançamento</label>
                            <input type="date" th:field="*{dataLancamento}" class="form-control bg-dark text-light border-secondary" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{dataLancamento}">Erro na data</div>
                        </div>

                        <!-- URL da Capa -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">URL da Imagem de Capa</label>
                            <input type="url" th:field="*{urlCapa}" class="form-control bg-dark text-light border-secondary" placeholder="https://...">
                        </div>
                    </div>

                    <!-- Descrição -->
                    <div class="mb-4">
                        <label class="form-label">Descrição</label>
                        <textarea th:field="*{descricao}" rows="3" class="form-control bg-dark text-light border-secondary"></textarea>
                    </div>

                    <!-- Botões -->
                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/jogos}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-purple">
                            <i class="bi bi-check-lg me-1"></i>Salvar Jogo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
