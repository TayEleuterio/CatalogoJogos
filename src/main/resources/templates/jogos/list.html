<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Jogos - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #121214; color: #e1e1e6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-custom { background-color: #202024; border-bottom: 2px solid #8257e5; }
        .table-custom { background-color: #202024; color: #e1e1e6; border-radius: 8px; overflow: hidden; }
        .table-custom th { background-color: #29292e; color: #8257e5; border-bottom: 1px solid #323238; }
        .table-custom td { border-bottom: 1px solid #323238; vertical-align: middle; }
        .btn-purple { background-color: #8257e5; color: #ffffff; font-weight: 600; }
        .btn-purple:hover { background-color: #996dff; color: #ffffff; }
        .cover-img { width: 50px; height: 65px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
        <div class="container">
          <a class="navbar-brand fw-bold text-uppercase" href="#" th:href="@{/jogos}">
              <i class="bi bi-controller text-primary me-2"></i>Game Catalog
         </a>
          <a th:href="@{/jogos/novo}" class="btn btn-purple"><i class="bi bi-plus-lg me-1"></i>Novo Jogo</a>
        </div>
    </nav>
    <div class="container">
        <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensagemSucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="row mb-4">
            <div class="col-md-6">
                <form th:action="@{/jogos}" method="get" class="d-flex gap-2">
                    <input type="text" name="buscar" th:value="${buscar}" class="form-control bg-dark text-light border-secondary" placeholder="Pesquisar por título...">
                    <button type="submit" class="btn btn-outline-light"><i class="bi bi-search"></i></button>
                    <a th:href="@{/jogos}" class="btn btn-outline-secondary" th:if="${buscar != null}"><i class="bi bi-x-circle"></i></a>
                </form>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-custom align-middle">
                <thead>
                    <tr>
                        <th>Capa</th>
                        <th><a th:href="@{/jogos(ordem='titulo', dir=${ordem == 'titulo' and dir == 'asc' ? 'desc' : 'asc'}, buscar=${buscar})}" class="text-decoration-none text-light">Título <i class="bi bi-arrow-down-up ms-1"></i></a></th>
                        <th>Gênero</th>
                        <th><a th:href="@{/jogos(ordem='preco', dir=${ordem == 'preco' and dir == 'asc' ? 'desc' : 'asc'}, buscar=${buscar})}" class="text-decoration-none text-light">Preço <i class="bi bi-arrow-down-up ms-1"></i></a></th>
                        <th>Lançamento</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="jogo : ${jogos}">
                        <td>
                            <img th:src="${jogo.urlCapa != null and !jogo.urlCapa.isBlank() ? jogo.urlCapa : 'https://via.placeholder.com/50x65?text=No+Cover'}" class="cover-img" alt="Capa">
                        </td>
                        <td class="fw-bold" th:text="${jogo.titulo}">Glover</td>
                        <td><span class="badge bg-secondary" th:text="${jogo.genero}">Ação</span></td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(jogo.preco, 1, 'POINT', 2, 'COMMA')}">R$ 19,99</td>
                        <td th:text="${#temporals.format(jogo.dataLancamento, 'dd/MM/yyyy')}">01/01/2020</td>
                        <td class="text-end">
                            <a th:href="@{/jogos/editar/{id}(id=${jogo.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
                            <a th:href="@{/jogos/excluir/{id}(id=${jogo.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Tem certeza que deseja excluir este jogo?')"><i class="bi bi-trash"></i></a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(jogos)}">
                        <td colspan="6" class="text-center py-4 text-muted">Nenhum jogo encontrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
